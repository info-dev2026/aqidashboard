<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saaphzone AQI Monitor — MAAPS Network</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --green:#073859; --green-d:#052840; --green-l:#0d5a86;
  --amber:#14adcd;
  --ink:#0d1a14; --muted:#5b6b62; --line:#e2e8e3;
  --bg:#eef3ef; --card:#ffffff;
  --good:#009966; --sat:#84cf33; --mod:#ffde33; --poor:#ff9933; --vpoor:#cc0033; --sev:#7e0023;
  --shadow:0 1px 3px rgba(13,26,20,.08),0 10px 30px rgba(13,26,20,.06);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
h1,h2,h3,h4{font-weight:800;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer;border:none;font-size:14px}
input,select,textarea{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green-l);outline-offset:-1px;border-color:transparent}
.hidden{display:none!important}
.brand{font-weight:900;letter-spacing:-.03em}
.brand .s{color:var(--green)} .brand .z{color:var(--amber)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:9px;font-weight:600;background:#eef1ee;color:var(--ink);transition:.15s}
.btn:hover{filter:brightness(.97)}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-d)}
.btn-amber{background:var(--amber);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-danger{background:#fdecec;color:var(--vpoor)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}

/* ===== LOGIN ===== */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 700px at 20% -10%,#0d5a86 0%,#0a3a5c 45%,#052236 100%);padding:20px}
.gate-card{width:100%;max-width:410px;background:var(--card);border-radius:20px;padding:34px 30px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.gate-logo{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:10px}
.gate-mark{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--green),var(--green-l));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px}
.gate-card h1{font-size:21px;text-align:center;margin-top:8px}
.gate-card .sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:20px}
.role-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:18px;background:#f1f4f1;padding:5px;border-radius:11px}
.role-tab{text-align:center;padding:9px 4px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s}
.role-tab.on{background:#fff;color:var(--green);box-shadow:var(--shadow)}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.gate-err{color:var(--vpoor);font-size:12.5px;min-height:16px;margin-bottom:8px;font-weight:600}
.gate-hint{margin-top:16px;font-size:11.5px;color:var(--muted);background:#f5f8f5;padding:10px 12px;border-radius:9px;line-height:1.7}

/* ===== APP SHELL ===== */
.app{display:none;min-height:100vh}
.app.on{display:flex}
.sidebar{width:238px;background:linear-gradient(180deg,#0a3a5c,#052236);color:#dfeede;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transition:.25s}
.sb-brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px}
.sb-mark{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sb-brand .bt{font-weight:900;font-size:16px;letter-spacing:-.02em}
.sb-brand .bs{font-size:10.5px;color:#7fc4dc;letter-spacing:.03em}
.sb-role{margin:0 14px 12px;padding:8px 12px;background:rgba(255,255,255,.08);border-radius:9px;font-size:11.5px}
.sb-role b{display:block;font-size:13px;color:#fff}
.sb-nav{flex:1;padding:4px 10px;overflow-y:auto}
.nav-i{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:9px;color:#bcd8e6;font-weight:600;font-size:13.5px;margin-bottom:3px;cursor:pointer;transition:.13s}
.nav-i:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-i.on{background:rgba(20,173,205,.24);color:#fff}
.nav-i .ic{width:19px;text-align:center;font-size:15px}
.sb-foot{padding:14px 18px;font-size:10.5px;color:#6fa8c2;border-top:1px solid rgba(255,255,255,.08);line-height:1.7}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#14adcd;margin-right:6px;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes mpulse{0%{transform:scale(1);opacity:.25}70%{transform:scale(2.1);opacity:0}100%{opacity:0}}
/* ---- MAAPS device health panel ---- */
.health-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:6px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;overflow:hidden}
.hcard h5{font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);margin:0}
.hcard .hval{font-size:15px;font-weight:700}
.hcard .hsub{font-size:11.5px;color:var(--muted);text-align:center}
/* fan */
.fan{width:74px;height:74px;position:relative}
.fan svg{width:100%;height:100%}
.fan.spin svg .blades{transform-origin:50px 50px;animation:fanspin 1.15s linear infinite}
.fan.fast svg .blades{animation-duration:.6s}
.fan.stop svg .blades{animation:none;opacity:.55}
@keyframes fanspin{to{transform:rotate(360deg)}}
/* power light */
.plight{width:16px;height:16px;border-radius:50%;display:inline-block;box-shadow:0 0 0 3px #fff,0 0 0 4px rgba(0,0,0,.06)}
.plight.on{background:#12c46a;box-shadow:0 0 0 3px #fff,0 0 10px 2px #12c46a99}
.plight.off{background:#e23}
.plight.blink{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.pw-row{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px}
/* pressure gauge (semicircle) */
.gauge{width:130px;height:74px;position:relative}
.gauge svg{width:100%;height:100%}
.gauge .needle{transform-origin:65px 65px;transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.gauge-val{font-size:16px;font-weight:800}
.dp-badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;color:#fff}
.svc-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700}
/* rain */
.rainbox{width:74px;height:74px;border-radius:12px;position:relative;overflow:hidden;background:linear-gradient(#dced f6,#eaf3fb)}
.rainbox.dry{background:linear-gradient(#fff7e6,#fdf0d0)}
.cloud{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:30px;z-index:2}
.drop{position:absolute;top:38px;width:2px;height:9px;background:#4aa3e0;border-radius:2px;animation:fall .7s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(30px);opacity:0}}
.sun{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px}
.badge-line{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 4px}
.mini-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.toggle-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.dtype-pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:#eef4f8;color:#356}
.type-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.type-opt{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.15s}
.type-opt.sel{border-color:var(--brand);background:#f0f9fc}
.type-opt h4{margin:0 0 3px;font-size:14px}
.type-opt p{margin:0;font-size:11.5px;color:var(--muted)}

.main{flex:1;margin-left:238px;min-width:0}
.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:30}
.tb-title{font-size:18px;font-weight:800}
.tb-right{display:flex;align-items:center;gap:14px}
.tb-badge{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green-l);background:#e3f4fa;padding:5px 11px;border-radius:20px}
.clock{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.menu-btn{display:none;background:transparent;font-size:22px;color:var(--ink)}
.content{padding:22px}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:700}
.kpi .val{font-size:30px;font-weight:900;margin-top:3px;letter-spacing:-.03em}
.kpi .un{font-size:13px;color:var(--muted);font-weight:600}
.kpi .accent{position:absolute;right:-14px;top:-14px;width:70px;height:70px;border-radius:50%;opacity:.12}

/* AQI hero */
.aqi-hero{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:0;overflow:hidden;margin-bottom:20px;display:grid;grid-template-columns:280px 1fr}
.aqi-dial{padding:26px;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;transition:background .4s}
.aqi-dial .num{font-size:62px;font-weight:900;line-height:1;letter-spacing:-.04em}
.aqi-dial .cat{font-size:16px;font-weight:800;margin-top:6px}
.aqi-dial .lbl{font-size:12px;opacity:.9;margin-top:10px;text-transform:uppercase;letter-spacing:.08em}
.aqi-info{padding:22px 26px}
.aqi-info h3{font-size:16px;margin-bottom:4px}
.aqi-info .loc{color:var(--muted);font-size:13px;margin-bottom:16px}
.poll-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.poll{background:#f7faf7;border-radius:11px;padding:12px 14px;border-left:4px solid var(--line)}
.poll .p-n{font-size:11.5px;color:var(--muted);font-weight:700}
.poll .p-v{font-size:22px;font-weight:900;letter-spacing:-.02em}
.poll .p-u{font-size:11px;color:var(--muted)}

/* cards / tables */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.card-h h3{font-size:15.5px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
tr:hover td{background:#f8faf8}
.tag{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700}
.tag-on{background:#e8f5e9;color:var(--green)}
.tag-off{background:#feeceb;color:var(--vpoor)}
.tag-cal{background:#fff4e5;color:var(--amber)}
.dev-status{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}

/* site cards grid */
.site-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.site-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:.18s;border:1px solid transparent}
.site-card:hover{transform:translateY(-3px);box-shadow:0 12px 34px rgba(13,26,20,.14);border-color:#d5e5d6}
.site-band{height:6px}
.site-body{padding:16px 18px}
.site-body h4{font-size:15px;margin-bottom:2px}
.site-body .cl{font-size:12px;color:var(--muted);margin-bottom:12px}
.site-metrics{display:flex;gap:16px;margin-bottom:12px}
.site-metrics .m .mv{font-size:20px;font-weight:900}
.site-metrics .m .ml{font-size:10.5px;color:var(--muted);font-weight:700}
.site-foot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:11px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,26,15,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:16px}
.modal-b{padding:20px 22px}
.modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.x{background:transparent;font-size:22px;color:var(--muted);line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* toast */
.toasts{position:fixed;bottom:22px;right:22px;z-index:80;display:flex;flex-direction:column;gap:10px}
.toast{background:#fff;border-left:4px solid var(--green);border-radius:10px;padding:13px 18px;box-shadow:0 10px 34px rgba(0,0,0,.18);font-size:13px;font-weight:600;min-width:250px;animation:slide .3s}
.toast.err{border-color:var(--vpoor)}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}

.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;margin:0 0 12px}
.empty{text-align:center;padding:40px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

#map{height:460px;border-radius:12px;z-index:1}
.map-wrap{position:relative}
.map-legend{position:absolute;bottom:14px;left:14px;z-index:500;background:#fff;border-radius:10px;padding:10px 13px;box-shadow:var(--shadow);font-size:12px}
.map-legend .ml-row{display:flex;align-items:center;gap:8px;margin:3px 0}
.map-legend .ml-dot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.map-pop{font-family:'Segoe UI',sans-serif;min-width:170px}
.map-pop h4{font-size:14px;margin-bottom:3px;color:var(--green)}
.map-pop .mp-row{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;margin:2px 0}
.map-pop .mp-aqi{display:inline-block;padding:2px 9px;border-radius:6px;font-weight:800;font-size:12px;color:#fff;margin-top:5px}
.leaflet-popup-content{margin:11px 13px}
@media(max-width:900px){
  .aqi-hero{grid-template-columns:1fr}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .menu-btn{display:block}
  .grid2{grid-template-columns:1fr}
}
</style>
</head><body>

function demoPressure(pIn,pOut,dpWarn,dpCrit,running){
  const dp=Math.round((+pIn||0)-(+pOut||0));
  if(!running)return{dp,level:'idle',label:'Device off',color:'#8a8a8a'};
  if(dp>=dpCrit)return{dp,level:'red',label:'Service required — filter clogged',color:'#cc0033'};
  if(dp<=50)return{dp,level:'red',label:'Service required — low ΔP',color:'#cc0033'};
  if(dp>=dpWarn)return{dp,level:'amber',label:'Monitor — pressure rising',color:'#ff9933'};
  return{dp,level:'green',label:'Healthy',color:'#009966'};
}
function demoPower(d){
  if(d.power_manual==='off')return{on:false,reason:'manual'};
  if(d.power_manual==='on')return{on:true,reason:'manual'};
  if(d.raining)return{on:false,reason:'rain'};
  if(d.sp_enabled){
    const band=+d.sp_band||0,p25=+d.pm25||0,p10=+d.pm10||0,s25=+d.sp25||0,s10=+d.sp10||0;
    const aboveStart=p25>s25&&p10>s10, belowStop=p25<(s25-band)&&p10<(s10-band);
    const curOn=d.power===undefined?true:!!d.power;
    if(curOn)return belowStop?{on:false,reason:'setpoint'}:{on:true,reason:'setpoint'};
    return aboveStart?{on:true,reason:'setpoint'}:{on:false,reason:'setpoint'};
  }
  return{on:true,reason:'auto'};
}

}

  async post(path,body){

      const code=(body.code&&body.code.trim().toUpperCase())||('S'+Date.now().toString(36).toUpperCase());
      const username=body.username||code;
      DEMO_SITES.push({code,username,name:body.name,client:body.client,project:body.project||'General',lat:+body.lat||null,lng:+body.lng||null,password:body.password||null});
      return{code,username,has_password:!!body.password};
    }
    const sitePw=path.match(/\/sites\/(.+)\/password/);
    if(sitePw){
      const code=decodeURIComponent(sitePw[1]);
      const s=DEMO_SITES.find(x=>x.code===code);
      if(!s)throw new Error('Site not found');
      if(body.username)s.username=body.username;
      if(body.remove_password)s.password=null;
      else if(body.password)s.password=body.password;
      return{ok:1,username:s.username||s.code,has_password:!!s.password};
    }
    if(path==='/devices'){if(DEMO_DEVICES.some(d=>d.device_id===body.device_id))throw new Error('Device ID already exists');
      DEMO_DEVICES.push(D({device_id:body.device_id,site_code:body.site_code,location:body.location||'',status:'offline',pm25:0,pm10:0,dev_type:body.dev_type==='basic'?'basic':'maaps',dp_warn:+body.dp_warn||1200,dp_crit:+body.dp_crit||1500,sp_enabled:body.sp_enabled?1:0,sp25:+body.sp25||60,sp10:+body.sp10||100,sp_band:10,power:1,last_seen:null}));
      return{device_id:body.device_id,api_key:'demo_key_'+body.device_id};}
    const ctl=path.match(/\/devices\/(.+)\/control/);
    if(ctl){const id=decodeURIComponent(ctl[1]);const d=DEMO_DEVICES.find(x=>x.device_id===id);if(!d)throw new Error('Not found');
      if(body.power!==undefined)d.power_manual=body.power==='auto'?null:body.power;
      if(body.transmit!==undefined)d.transmit=body.transmit?1:0;
      if(body.raining!==undefined)d.raining=body.raining?1:0;
      if(body.p_inlet!==undefined)d.p_inlet=+body.p_inlet;
      if(body.p_outlet!==undefined)d.p_outlet=+body.p_outlet;
      if(body.sp_enabled!==undefined)d.sp_enabled=body.sp_enabled?1:0;
      if(body.sp25!==undefined)d.sp25=+body.sp25;
      if(body.sp10!==undefined)d.sp10=+body.sp10;
      if(body.sp_band!==undefined)d.sp_band=+body.sp_band;
      d.power=demoPower(d).on?1:0;
      return demoEnrich(d);}
    if(path==='/users'){if(DEMO_USERS.some(u=>u.username===body.username))throw new Error('Username exists');
      DEMO_USERS.push({id:Date.now(),username:body.username,password:body.password,role:body.role,name:body.name||body.username,client:body.role==='client'?body.client:null});return{ok:1};}
    const pw=path.match(/\/users\/(.+)\/password/);
    if(pw){const u=DEMO_USERS.find(x=>String(x.id)===pw[1]);if(u)u.password=body.password;return{ok:1};}
    throw new Error('offline demo');
  },
  async put(path,body){
    const siteM=path.match(/\/sites\/(.+)/);
    if(siteM){
      const code=decodeURIComponent(siteM[1]);
      const s=DEMO_SITES.find(x=>x.code===code);
      if(!s)throw new Error('Site not found');
      if(body.username!==undefined)s.username=body.username;
      if(body.remove_password)s.password=null;
      else if(body.password)s.password=body.password;
      if(body.name)s.name=body.name;
      if(body.client)s.client=body.client;
      if(body.project)s.project=body.project;
      if(body.lat!==undefined)s.lat=+body.lat||null;
      if(body.lng!==undefined)s.lng=+body.lng||null;
      return {...s,has_password:!!s.password};
    }
    throw new Error('offline demo');
  },
  async del(path){
    if(path.match(/\/devices\//)){const id=decodeURIComponent(path.split('/')[2]);DEMO_DEVICES=DEMO_DEVICES.filter(d=>d.device_id!==id);return{deleted:1};}
    if(path.match(/\/users\//)){const id=path.split('/')[2];const u=DEMO_USERS.find(x=>String(x.id)===id);if(u&&u.username==='admin')throw new Error('Cannot delete the primary admin');
      const i=DEMO_USERS.findIndex(x=>String(x.id)===id);if(i>=0)DEMO_USERS.splice(i,1);return{ok:1};}
    throw new Error('offline demo');
  }
};

/* ---- CPCB AQI ---- */
const AQI_CATS=[{max:50,name:'Good',color:'#009966'},{max:100,name:'Satisfactory',color:'#84cf33'},
{max:200,name:'Moderate',color:'#ffde33'},{max:300,name:'Poor',color:'#ff9933'},
{max:400,name:'Very Poor',color:'#cc0033'},{max:999,name:'Severe',color:'#7e0023'}];
const BP_PM25=[[0,30,0,50],[31,60,51,100],[61,90,101,200],[91,120,201,300],[121,250,301,400],[251,500,401,500]];
const BP_PM10=[[0,50,0,50],[51,100,51,100],[101,250,101,200],[251,350,201,300],[351,430,301,400],[431,600,401,500]];
function subIndex(c,bp){for(const[Cl,Ch,Il,Ih]of bp){if(c>=Cl&&c<=Ch)return Math.round((Ih-Il)/(Ch-Cl)*(c-Cl)+Il);}return 500;}
function computeAQI(a,b){return Math.max(subIndex(a,BP_PM25),subIndex(b,BP_PM10));}
function aqiCat(a){for(const c of AQI_CATS)if(a<=c.max)return c;return AQI_CATS[5];}

const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function toast(m,err){const t=el('div','toast'+(err?' err':''),m);$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function siteByCode(code){return STATE.sites.find(s=>s.code===code);}
function avg(a){return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;}

/* ---- Fan / Gauge / Rain SVG builders ---- */
function fanSVG(){
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#eef4f8" stroke="#d6e2ea"/>
    <g class="blades" fill="#073859">
      ${[0,72,144,216,288].map(deg=>`<path d="M50 50 C 58 30, 74 26, 78 40 C 66 46, 56 48, 50 50 Z" transform="rotate(${deg} 50 50)"/>`).join('')}
    </g>
    <circle cx="50" cy="50" r="8" fill="#14adcd" stroke="#fff" stroke-width="2"/></svg>`;
}
function gaugeSVG(pct,color){ // pct 0..1 -> needle across 180°
  const ang=-90+Math.max(0,Math.min(1,pct))*180;
  return `<svg viewBox="0 0 130 78">
    <path d="M12 66 A53 53 0 0 1 118 66" fill="none" stroke="#e5edf2" stroke-width="11" stroke-linecap="round"/>
    <path d="M12 66 A53 53 0 0 1 118 66" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round"
      stroke-dasharray="${Math.PI*53}" stroke-dashoffset="${Math.PI*53*(1-Math.max(0,Math.min(1,pct)))}"/>
    <g class="needle" transform="rotate(${ang} 65 66)"><line x1="65" y1="66" x2="65" y2="24" stroke="#073859" stroke-width="3" stroke-linecap="round"/></g>
    <circle cx="65" cy="66" r="6" fill="#073859"/></svg>`;
}
function rainBox(raining){
  if(raining) return `<div class="rainbox"><div class="cloud">☁️</div>${[16,28,40,52,64].map((x,i)=>`<div class="drop" style="left:${x}%;animation-delay:${i*0.13}s"></div>`).join('')}</div>`;
  return `<div class="rainbox dry"><div class="sun">☀️</div></div>`;
}

/* ---- MAP ---- */
function renderMap(c){
  const devs=STATE.devices.filter(d=>{const s=siteByCode(d.site_code);return s&&s.lat!=null&&s.lng!=null;});
  const online=devs.filter(d=>d.status==='online').length;
  const bar=el('div','card');
  bar.innerHTML=`<div class="card-h"><h3>MAAPS Device Locations</h3>
    <div class="row" style="gap:8px">
      <span class="chip" style="background:#e3f9ef;color:#009966"><span class="dev-status" style="background:#009966"></span>${online} online</span>
      <span class="chip" style="background:#feeceb;color:#cc0033"><span class="dev-status" style="background:#cc0033"></span>${devs.length-online} offline</span>
      <span class="chip" style="background:#e3f4fa;color:var(--green-l)">${devs.length} devices</span></div></div>
    <div class="map-wrap"><div id="map"></div>
      <div class="map-legend"><div class="ml-row"><span class="ml-dot" style="background:#009966"></span>Online device</div>
        <div class="ml-row"><span class="ml-dot" style="background:#cc0033"></span>Offline device</div>
        <div class="ml-row" style="margin-top:5px;color:var(--muted)">Marker fill = AQI category</div></div></div>`;
  c.appendChild(bar);
  if(!devs.length){bar.querySelector('.map-wrap').innerHTML='<div class="empty">No geolocated devices. Add latitude/longitude when creating a site.</div>';return;}
  setTimeout(()=>{
    mapRef=L.map('map',{scrollWheelZoom:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(mapRef);
    const bounds=[];
    devs.forEach(d=>{const s=siteByCode(d.site_code);const lat=+s.lat,lng=+s.lng;
      const isOn=d.status==='online';const a=isOn?computeAQI(d.pm25,d.pm10):null;
      const ca=isOn?aqiCat(a):{color:'#8a8a8a',name:'Offline'};
      const isMaaps=d.dev_type==='maaps';
      const running=d.power_on&&isOn;
      // ring: green=running, red=off/offline
      const ring=running?'#12c46a':'#e23';
      const html=`<div style="position:relative;width:30px;height:30px">
        <div style="position:absolute;inset:0;border-radius:50%;background:${ring};opacity:.25;${running?'animation:mpulse 1.8s infinite':''}"></div>
        <div style="position:absolute;inset:5px;border-radius:50%;background:${ca.color};border:3px solid ${ring};box-shadow:0 2px 6px rgba(0,0,0,.35)"></div></div>`;
      const icon=L.divIcon({html,className:'',iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-14]});
      const pwTxt=!isOn?'● Offline':(d.power_on?'● Running':(d.power_reason==='rain'?'● Auto-off (rain)':'● Off'));
      const press=isMaaps&&d.pressure?d.pressure:null;
      const popup=`<div class="map-pop"><h4>${esc(d.device_id)}</h4>
        <div class="mp-row"><span>Type</span><b style="color:var(--ink)">${isMaaps?'MAAPS':'Basic PM'}</b></div>
        <div class="mp-row"><span>Site</span><b style="color:var(--ink)">${esc(s.name)}</b></div>
        <div class="mp-row"><span>Location</span><b style="color:var(--ink)">${esc(d.location)}</b></div>
        <div class="mp-row"><span>Power</span><b style="color:${ring}">${pwTxt}</b></div>
        ${isMaaps?`<div class="mp-row"><span>Rain</span><b style="color:var(--ink)">${d.raining?'🌧 Raining':'☀ Dry'}</b></div>`:''}
        ${press?`<div class="mp-row"><span>Filter ΔP</span><b style="color:${press.color}">${press.dp} Pa · ${press.level==='green'?'Healthy':press.level==='amber'?'Monitor':press.level==='red'?'Service req.':'—'}</b></div>`:''}
        ${isOn?`<div class="mp-row"><span>PM2.5 / PM10</span><b style="color:var(--ink)">${d.pm25} / ${d.pm10} µg/m³</b></div><span class="mp-aqi" style="background:${ca.color}">AQI ${a} · ${ca.name}</span>`:''}</div>`;
      L.marker([lat,lng],{icon}).addTo(mapRef).bindPopup(popup);bounds.push([lat,lng]);
    });
    if(bounds.length===1)mapRef.setView(bounds[0],13);else mapRef.fitBounds(bounds,{padding:[50,50],maxZoom:14});
  },60);
}

/* ---- MODALS ---- */
function openModal(title,bodyHTML,onSave,saveLabel){
  const bg=el('div','modal-bg');
  bg.innerHTML=`<div class="modal"><div class="modal-h"><h3>${title}</h3><button class="x">×</button></div>
    <div class="modal-b">${bodyHTML}</div><div class="modal-f"><button class="btn btn-ghost" data-c>Cancel</button><button class="btn btn-primary" data-s>${saveLabel||'Save'}</button></div></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.querySelector('.x').onclick=close;bg.querySelector('[data-c]').onclick=close;bg.onclick=e=>{if(e.target===bg)close();};
  bg.querySelector('[data-s]').onclick=async()=>{const r=await onSave(bg);if(r!==false)close();};
  return bg;
}

         <div class="fg"><label>X-Device-Key</label><input value="${esc(r.api_key)}" readonly onclick="this.select()"></div>
         <div class="fg"><label>Ingestion endpoint</label><input value="POST ${location.origin}/api/ingest" readonly onclick="this.select()"></div>`,()=>{go('devices');return true;},'Done');
      return true;
    }catch(e){toast(e.message,true);return false;}
  },'Add Device');
  // type switcher
  bg.querySelectorAll('.type-opt').forEach(o=>o.onclick=()=>{
    bg.querySelectorAll('.type-opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');
    const t=o.dataset.type;
    bg.querySelector('#maapsFields').style.display=t==='maaps'?'block':'none';
    const idf=bg.querySelector('#mId');
    if(t==='basic'&&idf.value==='MAAPS-')idf.value='BASIC-';
    if(t==='maaps'&&idf.value==='BASIC-')idf.value='MAAPS-';
  });
}
function userModal(){
  const clients=[...new Set(STATE.sites.map(s=>s.client))];
  const body=`<div class="grid2"><div class="fg"><label>User ID</label><input id="mUid" placeholder="e.g. hero"></div>
    <div class="fg"><label>Full name</label><input id="mUname" placeholder="e.g. Hero MotoCorp"></div></div>
    <div class="grid2"><div class="fg"><label>Role</label><select id="mRole" onchange="document.getElementById('clientWrap').style.display=this.value==='client'?'block':'none'">
      <option value="client">Client</option><option value="service">Service</option><option value="admin">Admin</option></select></div>
      <div class="fg"><label>Password (min 8)</label><input id="mUpass" type="text" placeholder="set password"></div></div>
    <div class="fg" id="clientWrap"><label>Client / organisation</label><input id="mUclient" list="clientList" placeholder="e.g. Hero MotoCorp Ltd"><datalist id="clientList">${clients.map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></div>`;
  openModal('Add User',body,async bg=>{
    const username=bg.querySelector('#mUid').value.trim(),role=bg.querySelector('#mRole').value,password=bg.querySelector('#mUpass').value;
    if(!username||!password){toast('User ID and password required',true);return false;}
    if(password.length<8){toast('Password must be 8+ characters',true);return false;}
    try{await API.post('/users',{username,password,role,name:bg.querySelector('#mUname').value||username,client:role==='client'?bg.querySelector('#mUclient').value:null});
      toast('User created');go('users');}catch(e){toast(e.message,true);return false;}
  },'Create User');
}
function pwModal(u){
  const body=`<p style="color:var(--muted);margin-bottom:14px">Change password for <b>${esc(u.username)}</b> (${esc(u.name)}).</p>
    <div class="fg"><label>New password (min 8)</label><input id="mNewPw" type="text" placeholder="enter new password"></div>`;
  openModal('Change Password',body,async bg=>{
    const p=bg.querySelector('#mNewPw').value;if(!p||p.length<8){toast('Password must be 8+ characters',true);return false;}
    try{await API.post('/users/'+u.id+'/password',{password:p});toast('Password updated for '+u.username);}catch(e){toast(e.message,true);return false;}
  },'Update Password');
}

/* ---- utils ---- */
function shade(hex,pct){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,r+Math.round(255*pct/100)));g=Math.max(0,Math.min(255,g+Math.round(255*pct/100)));b=Math.max(0,Math.min(255,b+Math.round(255*pct/100)));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function var_(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
setInterval(()=>{$('#clock').textContent=new Date().toLocaleString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});},1000);
